  - path: CA-17-1/로그관리지침.txt
    text: |
      로그 관리 지침 (2026-03-02 시행)
      1. CloudTrail 관리 이벤트 로그는 1년 이상 보관한다.
      2. 개인정보처리시스템 접속기록은 2년 이상 보관한다.
      3. CloudWatch Logs 보안 로그 그룹의 보존 기간은 365일 이상으로 설정한다.
      4. 보관 기간이 지난 로그는 S3 Glacier로 옮긴 뒤 폐기 대장에 기록한다.
      승인: 정보보호최고책임자 윤서준 (2026-02-25)
