    text: |
      # 클라우드 백업 절차서 v1.2
      ## 백업 대상과 주기
      - RDS: 자동 백업 매일, 보존 7일
      - S3 업무 버킷: 버전 관리 사용, 이전 버전 90일 보관
      - EC2 운영 서버: 주 1회 AMI 생성
      ## 담당
      - 운영팀 오지훈 (010-5678-9012)
      ## 복구
      - 장애 발생 시 담당자 판단으로 복구 수행
