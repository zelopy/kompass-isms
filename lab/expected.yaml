  - {rule: S3-002, resource: kompass-lab-restricted-policy, status: FAIL}
  - {rule: S3-002, resource: kompass-lab-public-acl, status: FAIL}
  - {rule: S3-003, resource: kompass-lab-public-policy, status: FAIL}
  - {rule: S3-003, resource: kompass-lab-restricted-policy, status: FAIL}
  - {rule: S3-003, resource: kompass-lab-logs, status: PASS}
  - {rule: S3-003, resource: kompass-lab-private, status: PASS}
  - {rule: S3-003, resource: kompass-lab-public-acl, status: PASS}
  - {rule: S3-004, resource: kompass-lab-logs, status: PASS}
  - {rule: S3-004, resource: kompass-lab-private, status: PASS}
  - {rule: S3-004, resource: kompass-lab-public-policy, status: PASS}
  - {rule: S3-004, resource: kompass-lab-restricted-policy, status: PASS}
  - {rule: S3-004, resource: kompass-lab-public-acl, status: PASS}
  - {rule: S3-005, resource: kompass-lab-private, status: PASS}
  - {rule: S3-005, resource: kompass-lab-logs, status: FAIL}
  - {rule: S3-005, resource: kompass-lab-public-policy, status: FAIL}
  - {rule: S3-005, resource: kompass-lab-restricted-policy, status: FAIL}
  - {rule: S3-005, resource: kompass-lab-public-acl, status: FAIL}
  - {rule: S3-006, resource: kompass-lab-public-acl, status: FAIL}
  - {rule: S3-006, resource: kompass-lab-logs, status: PASS}
  - {rule: S3-006, resource: kompass-lab-private, status: PASS}
  - {rule: S3-006, resource: kompass-lab-public-policy, status: PASS}
